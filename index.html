<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Himanshu Raj's portfolio: React projects, skills and contact details."
    />
    <meta name="theme-color" content="#02040d" />
    <title>Himanshu Raj | Full Stack Developer</title>
    <script>
      try {
        var t = localStorage.getItem("portfolio-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "light" ? "#dff8ff" : "#02040d");
        }
      } catch (e) {}
    </script>
    <meta name="google-site-verification" content="fzApnGdv8Fcc8pwSJ_JV0nNKuTRMiV80YOCMExulPVo" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
